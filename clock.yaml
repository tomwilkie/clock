esphome:
  name: clock
  friendly_name: Clock
  on_boot:
    then:
      - pcf8563.read_time:
      - light.turn_on: display_backlight
      - script.execute: update_minutes_hand

packages:
  core: !include debug.yaml
  face: !include
    file: face.yaml
    vars:
      time_id: rtctime

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Clock Fallback Hotspot"
    password: !secret wifi_password

captive_portal:

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

logger:

i2c:
  - id: internal_i2c
    sda: GPIO11
    scl: GPIO12

output:
  - platform: ledc
    pin: GPIO3
    id: buzzer
  - platform: ledc
    pin: GPIO9
    id: backlight_output

rtttl:
  output: buzzer

sensor:
  - platform: rotary_encoder
    id: encoder
    pin_a: GPIO40
    pin_b: GPIO41
    on_clockwise:
      - lvgl.widget.show: alarm_circle
      - script.execute: hide_alarm_circle
      - lambda: |-
          auto alarm_time_var = id(alarm_time).state_as_esptime();
          alarm_time_var.minute += 15;
          if (alarm_time_var.minute >= 60) {
            alarm_time_var.minute -= 60;
            alarm_time_var.hour = (alarm_time_var.hour + 1) % 24;
          }
          id(alarm_time).make_call().set_time(alarm_time_var).perform();
    on_anticlockwise:
      - lvgl.widget.show: alarm_circle
      - script.execute: hide_alarm_circle
      - lambda: |-
          auto alarm_time_var = id(alarm_time).state_as_esptime();
          if (alarm_time_var.minute < 15) {
            alarm_time_var.minute += 60;
            alarm_time_var.hour = (alarm_time_var.hour + 23) % 24;
          }
          alarm_time_var.minute -= 15;
          id(alarm_time).make_call().set_time(alarm_time_var).perform();

time:
  - platform: pcf8563
    id: rtctime
    i2c_id: internal_i2c
    address: 0x51
    on_time:
      - minutes: "*"
        then:
          - script.execute: update_minutes_hand

  - platform: sntp
    id: sntp_time
    timezone: Europe/London
    # chrony on Home Assistant; ESPHome ignores the DHCP NTP option.
    servers:
      - 192.168.0.12
    on_time_sync:
      then:
        - pcf8563.write_time:
        - script.execute: update_minutes_hand

datetime:
  - platform: template
    id: alarm_time
    name: "Alarm Time"
    type: time
    icon: "mdi:alarm"
    initial_value: "07:00:00"
    restore_value: true
    optimistic: yes
    on_value:
      then:
        - script.execute: update_minutes_hand

binary_sensor:
  - platform: gpio
    name: Button
    id: front_button
    pin:
      number: GPIO42
      inverted: true

  - platform: gpio
    name: Hold Button
    pin: GPIO46

spi:
  id: spi_bus
  mosi_pin: GPIO5
  clk_pin: GPIO6

light:
  - platform: monochromatic
    name: "Backlight"
    output: backlight_output
    id: display_backlight
    default_transition_length: 0s

display:
  - platform: mipi_spi
    id: round_display
    model: GC9A01A
    cs_pin: GPIO7
    reset_pin: GPIO8
    dc_pin: GPIO4
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never
    data_rate: 40MHz

