esphome:
  name: clock
  friendly_name: Clock
  on_boot:
    then:
      - pcf8563.read_time:
      - light.turn_on: display_backlight
      - script.execute: update_minutes_hand

packages:
  core: !include debug.yaml

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Clock Fallback Hotspot"
    password: !secret wifi_password

captive_portal:

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

logger:

i2c:
  - id: internal_i2c
    sda: GPIO11
    scl: GPIO12

output:
  - platform: ledc
    pin: GPIO3
    id: buzzer
  - platform: ledc
    pin: GPIO9
    id: backlight_output

rtttl:
  output: buzzer

sensor:
  - platform: rotary_encoder
    id: encoder
    pin_a: GPIO40
    pin_b: GPIO41
    on_clockwise:
      - lvgl.widget.show: alarm_circle
      - script.execute: hide_alarm_circle
      - lambda: |-
          auto alarm_time_var = id(alarm_time).state_as_esptime();
          alarm_time_var.minute += 15;
          if (alarm_time_var.minute >= 60) {
            alarm_time_var.minute -= 60;
            alarm_time_var.hour = (alarm_time_var.hour + 1) % 24;
          }
          id(alarm_time).make_call().set_time(alarm_time_var).perform();
    on_anticlockwise:
      - lvgl.widget.show: alarm_circle
      - script.execute: hide_alarm_circle
      - lambda: |-
          auto alarm_time_var = id(alarm_time).state_as_esptime();
          if (alarm_time_var.minute < 15) {
            alarm_time_var.minute += 60;
            alarm_time_var.hour = (alarm_time_var.hour + 23) % 24;
          }
          alarm_time_var.minute -= 15;
          id(alarm_time).make_call().set_time(alarm_time_var).perform();

time:
  - platform: pcf8563
    id: rtctime
    i2c_id: internal_i2c
    address: 0x51
    on_time:
      - minutes: "*"
        then:
          - script.execute: update_minutes_hand

  - platform: sntp
    id: sntp_time
    timezone: Europe/London
    # chrony on Home Assistant; ESPHome ignores the DHCP NTP option.
    servers:
      - 192.168.0.12
    on_time_sync:
      then:
        - pcf8563.write_time:
        - script.execute: update_minutes_hand

datetime:
  - platform: template
    id: alarm_time
    name: "Alarm Time"
    type: time
    icon: "mdi:alarm"
    initial_value: "07:00:00"
    restore_value: true
    optimistic: yes
    on_value:
      then:
        - script.execute: update_minutes_hand

binary_sensor:
  - platform: gpio
    name: Button
    id: front_button
    pin:
      number: GPIO42
      inverted: true

  - platform: gpio
    name: Hold Button
    pin: GPIO46

spi:
  id: spi_bus
  mosi_pin: GPIO5
  clk_pin: GPIO6

light:
  - platform: monochromatic
    name: "Backlight"
    output: backlight_output
    id: display_backlight
    default_transition_length: 0s

display:
  - platform: mipi_spi
    id: round_display
    model: GC9A01A
    cs_pin: GPIO7
    reset_pin: GPIO8
    dc_pin: GPIO4
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never
    data_rate: 40MHz

font:
  - file:
      type: gfonts
      family: Roboto Condensed
      weight: 500
    id: minute_font
    size: 21
    glyphs: "0123456789:Alarm"
  - file:
      type: gfonts
      family: Roboto Condensed
      weight: 500
    id: hour_font
    size: 15
    glyphs: "0123456789"
  - file:
      type: gfonts
      family: Noto Sans Symbols 2
    id: triangle_font
    size: 22
    glyphs: "▲"

lvgl:
  refresh_interval: 10ms
  style_definitions:
    - id: date_style # choose an ID for your definition
      text_font: montserrat_14
      align: center
      text_color: White
      bg_opa: TRANSP
      radius: 4
      pad_all: 2
    - id: minute_numeral
      text_font: minute_font
      text_color: 0xE8DDBE
      align: center
    - id: hour_numeral
      text_font: hour_font
      text_color: 0xE8DDBE
      align: center
  pages:
    - id: main_page
      height: 100%
      width: 100%
      bg_color: Black
      widgets:
        # The Type B dial sits before the meter, so the meter's hands draw
        # over it: minute numerals on the outer ring, a triangle at 12 and
        # the hours inside an inner ring.
        - label:
            text_font: triangle_font
            text_color: 0xE8DDBE
            text: "▲"
            align: center
            y: -86
        - label:
            styles: minute_numeral
            text: "5"
            x: 43
            y: -74
        - label:
            styles: minute_numeral
            text: "10"
            x: 74
            y: -43
        - label:
            styles: minute_numeral
            text: "15"
            x: 86
            y: 0
        - label:
            styles: minute_numeral
            text: "20"
            x: 74
            y: 43
        - label:
            styles: minute_numeral
            text: "25"
            x: 43
            y: 74
        - label:
            styles: minute_numeral
            text: "30"
            x: 0
            y: 86
        - label:
            styles: minute_numeral
            text: "35"
            x: -43
            y: 74
        - label:
            styles: minute_numeral
            text: "40"
            x: -74
            y: 43
        - label:
            styles: minute_numeral
            text: "45"
            x: -86
            y: 0
        - label:
            styles: minute_numeral
            text: "50"
            x: -74
            y: -43
        - label:
            styles: minute_numeral
            text: "55"
            x: -43
            y: -74
        - obj:
            width: 124
            height: 124
            align: CENTER
            radius: 62
            bg_opa: TRANSP
            border_width: 2
            border_color: 0xE8DDBE
            pad_all: 0
        - label:
            styles: hour_numeral
            text: "1"
            x: 24
            y: -42
        - label:
            styles: hour_numeral
            text: "2"
            x: 42
            y: -24
        - label:
            styles: hour_numeral
            text: "3"
            x: 48
            y: 0
        - label:
            styles: hour_numeral
            text: "4"
            x: 42
            y: 24
        - label:
            styles: hour_numeral
            text: "5"
            x: 24
            y: 42
        - label:
            styles: hour_numeral
            text: "6"
            x: 0
            y: 48
        - label:
            styles: hour_numeral
            text: "7"
            x: -24
            y: 42
        - label:
            styles: hour_numeral
            text: "8"
            x: -42
            y: 24
        - label:
            styles: hour_numeral
            text: "9"
            x: -48
            y: 0
        - label:
            styles: hour_numeral
            text: "10"
            x: -42
            y: -24
        - label:
            styles: hour_numeral
            text: "11"
            x: -24
            y: -42
        - label:
            styles: hour_numeral
            text: "12"
            x: 0
            y: -48
        - meter:
            height: 100%
            width: 100%
            align: CENTER
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            text_color: White
            scales:
              - range_from: 0 # minutes scale
                range_to: 60
                angle_range: 360
                rotation: 270
                ticks:
                  width: 1
                  count: 61
                  length: 7
                  color: 0xE8DDBE
                indicators:
                  - line:
                      id: minute_hand
                      width: 4
                      color: 0xE8DDBE
                      rounded: true
                      length: -12
                      value: 0
              # Five-minute and quarter-hour ticks. Plain ticks, not major
              # ticks, because major ticks bring scale labels with them.
              - range_from: 0
                range_to: 12
                angle_range: 360
                rotation: 270
                ticks:
                  width: 3
                  count: 13
                  length: 12
                  color: 0xE8DDBE
              - range_from: 0
                range_to: 4
                angle_range: 360
                rotation: 270
                ticks:
                  width: 3
                  count: 5
                  length: 18
                  color: 0xE8DDBE
              - range_from: 0 # hi-res hours scale for hand
                range_to: 720
                angle_range: 360
                rotation: 270
                ticks:
                  count: 2
                  width: 0
                  length: 0
                indicators:
                  - line:
                      id: hour_hand
                      width: 6
                      color: 0xE8DDBE
                      rounded: true
                      # Tip 10 px inside the hour ring, as the minute hand's
                      # tip is 10 px inside the edge of the dial.
                      length: -71
                      value: 0
        # The second hand is a separate line widget, not a meter indicator,
        # because indicator angles round to whole degrees. It sits after the
        # meter and before the centre circle, so the circle draws on top.
        - line:
            id: secs_hand
            points:
              - 0, 0
              - 0, 0
            line_width: 2
            line_color: Red
            line_rounded: true
        # Centre cap over the pivot, above the hands and below the alarm circle.
        - obj:
            width: 14
            height: 14
            align: CENTER
            radius: 7
            bg_color: 0xE8DDBE
            bg_opa: COVER
            border_width: 0
            pad_all: 0
        - obj:
            id: alarm_circle
            hidden: true
            width: 124
            height: 124
            align: CENTER
            bg_color: Black
            bg_opa: 85%
            radius: 62
            clip_corner: true
            pad_all: 0
            border_width: 2
            border_color: 0xE8DDBE
            widgets:
              - label:
                  styles: date_style
                  id: alarm_label
                  text_font: minute_font
                  text_color: 0xE8DDBE
                  text_align: center
                  text: ""

interval:
  - interval: 33ms
    then:
      - lambda: |-
          // Seconds and microseconds from one gettimeofday() call, so the
          // hand never steps back at the turn of a second.
          struct timeval tv;
          gettimeofday(&tv, nullptr);
          const float ms = (tv.tv_sec % 60) * 1000 + tv.tv_usec / 1000;
          const float angle = ms * (2.0f * M_PI / 60000.0f);
          const float s = sinf(angle), c = cosf(angle);
          const int32_t tip_x = lroundf(120 + 114 * s), tip_y = lroundf(120 - 114 * c);
          const int32_t tail_x = lroundf(120 - 16 * s), tail_y = lroundf(120 + 16 * c);
          // Size the line object to the hand's bounding box, so each frame
          // redraws only the area around the old and new hand.
          const int32_t x0 = std::min(tip_x, tail_x), y0 = std::min(tip_y, tail_y);
          static lv_point_precise_t points[2];
          if (lv_obj_get_x(id(secs_hand)->obj) == x0 && lv_obj_get_y(id(secs_hand)->obj) == y0 &&
              points[0].x == tip_x - x0 && points[0].y == tip_y - y0 &&
              points[1].x == tail_x - x0 && points[1].y == tail_y - y0)
            return;
          points[0] = {tip_x - x0, tip_y - y0};
          points[1] = {tail_x - x0, tail_y - y0};
          lv_obj_set_pos(id(secs_hand)->obj, x0, y0);
          lv_line_set_points(id(secs_hand)->obj, points, 2);

script:
  - id: update_minutes_hand
    then:
      - lvgl.indicator.update:
          id: hour_hand
          value: !lambda |-
            auto now = id(rtctime).now();
            return std::fmod(now.hour, 12) * 60 + now.minute;
      - lvgl.indicator.update:
          id: minute_hand
          value: !lambda |-
            return id(rtctime).now().minute;
      - lvgl.label.update:
          id: alarm_label
          text: !lambda |-
            auto alarm_time_var = id(alarm_time);
            static char alarm_buf[16];
            snprintf(alarm_buf, sizeof(alarm_buf), "Alarm\n%02d:%02d", alarm_time_var->hour, alarm_time_var->minute);
            return alarm_buf;

  # Hide the alarm circle three seconds after the last turn of the dial.
  - id: hide_alarm_circle
    mode: restart
    then:
      - delay: 3s
      - lvgl.widget.hide: alarm_circle
