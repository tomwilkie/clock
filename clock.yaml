esphome:
  name: clock
  friendly_name: Clock
  on_boot:
    then:
      - pcf8563.read_time:
      - light.turn_on: display_backlight
      - script.execute: update_minutes_hand

packages:
  core: !include debug.yaml

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Clock Fallback Hotspot"
    password: !secret wifi_password

captive_portal:

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

logger:

i2c:
  - id: internal_i2c
    sda: GPIO11
    scl: GPIO12

output:
  - platform: ledc
    pin: GPIO3
    id: buzzer
  - platform: ledc
    pin: GPIO9
    id: backlight_output

rtttl:
  output: buzzer

sensor:
  - platform: rotary_encoder
    id: encoder
    pin_a: GPIO40
    pin_b: GPIO41
    on_clockwise:
      - lambda: |-
          auto alarm_time_var = id(alarm_time).state_as_esptime();
          alarm_time_var.minute += 15;
          if (alarm_time_var.minute >= 60) {
            alarm_time_var.minute -= 60;
            alarm_time_var.hour = (alarm_time_var.hour + 1) % 24;
          }
          id(alarm_time).make_call().set_time(alarm_time_var).perform();
    on_anticlockwise:
      - lambda: |-
          auto alarm_time_var = id(alarm_time).state_as_esptime();
          if (alarm_time_var.minute < 15) {
            alarm_time_var.minute += 60;
            alarm_time_var.hour = (alarm_time_var.hour + 23) % 24;
          }
          alarm_time_var.minute -= 15;
          id(alarm_time).make_call().set_time(alarm_time_var).perform();

time:
  - platform: pcf8563
    id: rtctime
    i2c_id: internal_i2c
    address: 0x51
    on_time:
      - minutes: "*"
        then:
          - script.execute: update_minutes_hand

  - platform: sntp
    id: sntp_time
    timezone: Europe/London
    # chrony on Home Assistant; ESPHome ignores the DHCP NTP option.
    servers:
      - 192.168.0.12
    on_time_sync:
      then:
        - pcf8563.write_time:
        - script.execute: update_minutes_hand

datetime:
  - platform: template
    id: alarm_time
    name: "Alarm Time"
    type: time
    icon: "mdi:alarm"
    initial_value: "07:00:00"
    restore_value: true
    optimistic: yes
    on_value:
      then:
        - script.execute: update_minutes_hand

binary_sensor:
  - platform: gpio
    name: Button
    id: front_button
    pin:
      number: GPIO42
      inverted: true

  - platform: gpio
    name: Hold Button
    pin: GPIO46

spi:
  id: spi_bus
  mosi_pin: GPIO5
  clk_pin: GPIO6

light:
  - platform: monochromatic
    name: "Backlight"
    output: backlight_output
    id: display_backlight
    default_transition_length: 0s

display:
  - platform: mipi_spi
    id: round_display
    model: GC9A01A
    cs_pin: GPIO7
    reset_pin: GPIO8
    dc_pin: GPIO4
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never
    data_rate: 40MHz

lvgl:
  refresh_interval: 10ms
  style_definitions:
    - id: date_style # choose an ID for your definition
      text_font: montserrat_14
      align: center
      text_color: White
      bg_opa: TRANSP
      radius: 4
      pad_all: 2
  pages:
    - id: main_page
      height: 100%
      width: 100%
      bg_color: Black
      widgets:
        - meter:
            height: 100%
            width: 100%
            align: CENTER
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            text_color: White
            scales:
              - range_from: 0 # minutes scale
                range_to: 60
                angle_range: 360
                rotation: 270
                ticks:
                  width: 1
                  count: 61
                  length: 10
                  color: White
                indicators:
                  - line:
                      id: minute_hand
                      width: 4
                      color: White
                      rounded: true
                      length: -12
                      value: 0
              - range_from: 1 # hours scale for labels
                range_to: 12
                angle_range: 330
                rotation: 300
                ticks:
                  width: 1
                  count: 12
                  length: 1
                  major:
                    stride: 1
                    width: 4
                    length: 10
                    color: White
                    label_gap: 12
              - range_from: 0 # hi-res hours scale for hand
                range_to: 720
                angle_range: 360
                rotation: 270
                ticks:
                  count: 2
                  width: 0
                  length: 0
                indicators:
                  - line:
                      id: hour_hand
                      width: 6
                      color: White
                      rounded: true
                      length: -40
                      value: 0
        # The second hand is a separate line widget, not a meter indicator,
        # because indicator angles round to whole degrees. It sits after the
        # meter and before the centre circle, so the circle draws on top.
        - line:
            id: secs_hand
            points:
              - 0, 0
              - 0, 0
            line_width: 2
            line_color: Red
            line_rounded: true
        - obj:
            width: 120
            height: 120
            align: CENTER
            bg_color: Black
            bg_opa: 85%
            radius: 60
            clip_corner: true
            pad_all: 0
            border_width: 1
            widgets:
              - label:
                  styles: date_style
                  id: alarm_label
                  y: -20
                  text: ""
              - label:
                  id: date_label
                  styles: date_style
                  y: 20
                  text: ""

interval:
  - interval: 33ms
    then:
      - lambda: |-
          // Seconds and microseconds from one gettimeofday() call, so the
          // hand never steps back at the turn of a second.
          struct timeval tv;
          gettimeofday(&tv, nullptr);
          const float ms = (tv.tv_sec % 60) * 1000 + tv.tv_usec / 1000;
          const float angle = ms * (2.0f * M_PI / 60000.0f);
          const float s = sinf(angle), c = cosf(angle);
          const int32_t tip_x = lroundf(120 + 114 * s), tip_y = lroundf(120 - 114 * c);
          const int32_t tail_x = lroundf(120 - 16 * s), tail_y = lroundf(120 + 16 * c);
          // Size the line object to the hand's bounding box, so each frame
          // redraws only the area around the old and new hand.
          const int32_t x0 = std::min(tip_x, tail_x), y0 = std::min(tip_y, tail_y);
          static lv_point_precise_t points[2];
          if (lv_obj_get_x(id(secs_hand)->obj) == x0 && lv_obj_get_y(id(secs_hand)->obj) == y0 &&
              points[0].x == tip_x - x0 && points[0].y == tip_y - y0 &&
              points[1].x == tail_x - x0 && points[1].y == tail_y - y0)
            return;
          points[0] = {tip_x - x0, tip_y - y0};
          points[1] = {tail_x - x0, tail_y - y0};
          lv_obj_set_pos(id(secs_hand)->obj, x0, y0);
          lv_line_set_points(id(secs_hand)->obj, points, 2);

script:
  - id: update_minutes_hand
    then:
      - lvgl.indicator.update:
          id: hour_hand
          value: !lambda |-
            auto now = id(rtctime).now();
            return std::fmod(now.hour, 12) * 60 + now.minute;
      - lvgl.indicator.update:
          id: minute_hand
          value: !lambda |-
            return id(rtctime).now().minute;
      - lvgl.label.update:
          id: alarm_label
          text: !lambda |-
            auto alarm_time_var = id(alarm_time);
            static char alarm_buf[16];
            snprintf(alarm_buf, sizeof(alarm_buf), "Alarm %02d:%02d", alarm_time_var->hour, alarm_time_var->minute);
            return alarm_buf;
      - lvgl.label.update:
          id: date_label
          text: !lambda |-
            static const char * const day_names[] = {"Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"};
            static const char * const mon_names[] = {"Jan", "Feb", "Mar", "Apr", "May", "Jun",
                                                     "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"};
            static char date_buf[16];
            auto now = id(rtctime).now();
            if (!now.is_valid())
              return "";
            snprintf(date_buf, sizeof(date_buf), "%s, %s %2d", day_names[now.day_of_week - 1], mon_names[now.month - 1], now.day_of_month);
            return date_buf;
